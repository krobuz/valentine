<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>kO tHể Từ ChỐi 💖</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat+Brush&display=swap" rel="stylesheet">
</head>

<body>

    <div class="heart-bg" id="bg"></div>

    <div class="container">
        <img src="img\pics1.jpg" alt="Cute Gif" class="main-image">

        <h1>Cậu làm người yêu tớ nhé?</h1>

        <div class="button-area">
            <div class="btn-wrapper" id="btn-yes-wrapper">
                <img src="img/button.png" alt="Đồng ý" class="img-btn">
                <span class="btn-text" id="text-yes">Đồng ý</span>
            </div>

            <div class="btn-wrapper" id="btn-no-wrapper">
                <img src="img/button.png" alt="Từ chối" class="img-btn">
                <span class="btn-text" id="text-no">Từ chối</span>
            </div>
        </div>
    </div>

    <div id="msg-popup" class="popup-overlay">
        <div class="popup-content">
            <h2>Hehe tớ biết mà! ❤️</h2>
            <p>Yêu cậu nhiều lắm! 😘</p>
            <button class="close-btn" onclick="closePopup()">Hihi ngại quá</button>
        </div>
    </div>
</body>
<script src="index.js"></script>

</html>
